<style>
/* ==========================================================================
   SISTEMA DE DISEÑO VISUAL - MESA DE AYUDA DIALIMENTOS (DIALI®)
   Basado en el Manual de Imagen Corporativa Oficial DIALI®
   Paleta: Morado Pantone 2425 C (#830065), Rosado Pantone Rubine Red C (#CE0058),
           Blanco Puro, Escala de Negros Profundos y Acentos Complementarios.
   Tipografía Oficial: Heebo (Google Fonts)
   ========================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');

:root {
  /* ── 1. Paleta Cromática Corporativa DIALI® ────────────────────────── */
  --diali-purple: #830065;          /* Pantone 2425 C (Morado Institucional) */
  --diali-purple-light: #9f1285;    /* Morado Luminoso */
  --diali-purple-glow: rgba(131, 0, 101, 0.45);
  
  --diali-pink: #CE0058;            /* Pantone Rubine Red C (Rosado / Magenta Vibrante) */
  --diali-pink-hover: #b3004b;      /* Rosado Intenso */
  --diali-pink-light: #ff3388;      /* Rosado Brillante */
  --diali-pink-soft: #f472b6;       /* Rosado Pastel Acento */
  --diali-pink-glow: rgba(206, 0, 88, 0.4);

  /* ── 2. Fondos y Superficies Dark Mode de Alta Gama (Negros & Ciruelas) ─ */
  --bg-main: #0a030d;               /* Negro Obsidiana con matiz ciruela sutil */
  --bg-surface: #130718;            /* Superficie base */
  --bg-card: rgba(21, 9, 27, 0.82); /* Glassmorphism oscuro */
  --bg-card-hover: rgba(36, 15, 46, 0.9);
  --bg-input: #1a0b22;              /* Fondo de inputs */
  --bg-modal: #120617;              /* Fondo de modales */

  /* ── 3. Bordes y Delimitadores ────────────────────────────────────────── */
  --border-subtle: rgba(206, 0, 88, 0.16);
  --border-card: rgba(255, 255, 255, 0.08);
  --border-focus: #CE0058;
  --border-hover: rgba(206, 0, 88, 0.4);

  /* ── 4. Colores de Acento y Acciones ──────────────────────────────────── */
  --primary: #CE0058;
  --primary-hover: #b3004b;
  --primary-glow: rgba(206, 0, 88, 0.35);
  --secondary: #830065;
  --accent-orange: #FFB549;         /* Pantone 1365 C */

  /* ── 5. Estados de Tickets (Manual de Marca DIALI®) ───────────────────── */
  --status-abierto: #2CD5C4;        /* Pantone 3255 C - Turquesa / Cian */
  --status-abierto-bg: rgba(44, 213, 196, 0.14);
  --status-proceso: #FFB549;        /* Pantone 1365 C - Naranja Cálido */
  --status-proceso-bg: rgba(255, 181, 73, 0.15);
  --status-pendiente: #f43f5e;      /* Rosado Rojizo */
  --status-pendiente-bg: rgba(244, 63, 94, 0.16);
  --status-cerrado: #78D64B;        /* Pantone 7488 C - Verde Lima */
  --status-cerrado-bg: rgba(120, 214, 75, 0.16);

  /* ── 6. Tipografía y Textos (Heebo Oficial) ──────────────────────────── */
  --text-main: #ffffff;             /* Blanco Puro */
  --text-secondary: #f1f5f9;        /* Blanco Hielo */
  --text-muted: #d8b4e2;            /* Lavanda suave legible */
  --text-dim: #94729e;              /* Púrpura agrisado tenue */
  --font-heading: 'Heebo', sans-serif;
  --font-body: 'Heebo', sans-serif;

  /* ── 7. Sombras, Radios y Transiciones ────────────────────────────────── */
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 14px 35px -6px rgba(0, 0, 0, 0.65), 0 8px 12px -6px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 24px rgba(206, 0, 88, 0.35);
  --shadow-glow-purple: 0 0 24px rgba(131, 0, 101, 0.4);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Reset & base */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image: 
    radial-gradient(at 0% 0%, rgba(131, 0, 101, 0.28) 0px, transparent 55%),
    radial-gradient(at 100% 100%, rgba(206, 0, 88, 0.20) 0px, transparent 50%),
    radial-gradient(at 50% 20%, rgba(159, 18, 133, 0.10) 0px, transparent 40%);
  background-attachment: fixed;
}

.app-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.15rem 1.75rem;
  background: var(--bg-card);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: 2rem;
  box-shadow: var(--shadow-sm);
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

.brand-logo-container {
  display: flex;
  align-items: center;
}

.brand-text h1 {
  font-family: var(--font-heading);
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(to right, #ffffff, #fce7f3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-text p {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.user-profile-badge {
  display: flex;
  align-items: center;
  gap: 1rem;
  background: rgba(131, 0, 101, 0.15);
  padding: 0.5rem 1.15rem;
  border-radius: var(--radius-full);
  border: 1px solid rgba(206, 0, 88, 0.28);
}

.user-avatar {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--diali-pink), var(--diali-purple));
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.9rem;
  color: #ffffff;
  box-shadow: 0 0 10px rgba(206, 0, 88, 0.4);
}

.user-info {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 0.88rem;
  font-weight: 700;
  color: #ffffff;
}

.user-role {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 500;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.25rem;
  margin-bottom: 2rem;
}

.kpi-card {
  background: var(--bg-card);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.25rem 1.4rem;
  display: flex;
  align-items: center;
  gap: 1.15rem;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--diali-pink), var(--diali-purple));
  opacity: 0.7;
}

.kpi-card:hover {
  transform: translateY(-3px);
  border-color: rgba(206, 0, 88, 0.4);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(206, 0, 88, 0.2);
}

.kpi-icon-box {
  width: 50px;
  height: 50px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.45rem;
}

.kpi-val {
  font-family: var(--font-heading);
  font-size: 1.9rem;
  font-weight: 800;
  line-height: 1;
  color: #ffffff;
}

.kpi-label {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.25rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
}

.actions-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 260px;
  max-width: 420px;
}

.search-input {
  width: 100%;
  padding: 0.75rem 1rem 0.75rem 2.6rem;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-size: 0.9rem;
  font-family: var(--font-body);
  transition: var(--transition);
}

.search-input:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.search-icon {
  position: absolute;
  left: 0.95rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--diali-pink-soft);
  font-size: 1rem;
}

.filters-wrapper {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}

.select-custom {
  background: var(--bg-input);
  color: var(--text-main);
  border: 1px solid var(--border-subtle);
  padding: 0.7rem 1.25rem;
  border-radius: var(--radius-md);
  font-size: 0.86rem;
  font-family: var(--font-body);
  cursor: pointer;
  transition: var(--transition);
}

.select-custom:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.72rem 1.4rem;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.88rem;
  cursor: pointer;
  border: none;
  transition: var(--transition);
  font-family: var(--font-body);
  letter-spacing: 0.01em;
}

.btn-primary {
  background: linear-gradient(135deg, var(--diali-pink) 0%, var(--diali-purple) 100%);
  color: #ffffff;
  box-shadow: 0 4px 14px rgba(206, 0, 88, 0.4);
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--diali-pink-light) 0%, var(--diali-purple-light) 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(206, 0, 88, 0.55);
}

.btn-secondary {
  background: rgba(131, 0, 101, 0.2);
  color: #ffffff;
  border: 1px solid rgba(206, 0, 88, 0.35);
}

.btn-secondary:hover {
  background: rgba(206, 0, 88, 0.25);
  border-color: var(--diali-pink);
  transform: translateY(-1px);
}

.btn-danger {
  background: #dc2626;
  color: white;
}

.btn-danger:hover {
  background: #ef4444;
}

.btn-success {
  background: #059669;
  color: white;
}

.btn-success:hover {
  background: #10b981;
}

.btn-sm {
  padding: 0.45rem 0.85rem;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

/* ── Spinner animado para botones de acción ── */
.spinner-btn {
  width: 1.15rem;
  height: 1.15rem;
  border: 2.5px solid rgba(255, 255, 255, 0.35);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spinBtn 0.75s linear infinite;
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

@keyframes spinBtn {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.table-card {
  background: var(--bg-card);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
}

.custom-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.88rem;
}

.custom-table th {
  background: rgba(19, 7, 24, 0.88);
  padding: 1.05rem 1.15rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  font-size: 0.74rem;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border-subtle);
}

.custom-table td {
  padding: 1.05rem 1.15rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  vertical-align: middle;
}

.custom-table tr:hover td {
  background-color: var(--bg-card-hover);
}

.ticket-code {
  font-family: var(--font-heading);
  font-weight: 800;
  color: #ff3388;
  letter-spacing: 0.02em;
}

.badge-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.28rem 0.7rem;
  border-radius: var(--radius-full);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.badge-abierto { background: var(--status-abierto-bg); color: var(--status-abierto); border: 1px solid rgba(44, 213, 196, 0.35); }
.badge-proceso { background: var(--status-proceso-bg); color: var(--status-proceso); border: 1px solid rgba(255, 181, 73, 0.35); }
.badge-pendiente { background: var(--status-pendiente-bg); color: var(--status-pendiente); border: 1px solid rgba(244, 63, 94, 0.35); }
.badge-cerrado { background: var(--status-cerrado-bg); color: var(--status-cerrado); border: 1px solid rgba(120, 214, 75, 0.35); }

.badge-area-mto { background: rgba(206, 0, 88, 0.16); color: #f472b6; border: 1px solid rgba(206, 0, 88, 0.35); }
.badge-area-tic { background: rgba(131, 0, 101, 0.28); color: #e879f9; border: 1px solid rgba(131, 0, 101, 0.45); }

.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(5, 1, 7, 0.82);
  backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-backdrop.active {
  opacity: 1;
  visibility: visible;
}

.modal-container {
  background: var(--bg-modal);
  border: 1px solid rgba(206, 0, 88, 0.3);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 780px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85), 0 0 30px rgba(131, 0, 101, 0.25);
  transform: translateY(20px);
  transition: var(--transition);
}

.modal-backdrop.active .modal-container {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.25rem 1.75rem;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(26, 11, 33, 0.7);
  position: sticky;
  top: 0;
  z-index: 10;
}

.modal-title {
  font-family: var(--font-heading);
  font-size: 1.25rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  color: #ffffff;
}

.btn-close {
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.6rem;
  cursor: pointer;
  line-height: 1;
  transition: var(--transition);
}

.btn-close:hover {
  color: var(--diali-pink-light);
  transform: scale(1.1);
}

.modal-body {
  padding: 1.75rem;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
  padding: 1.25rem 1.75rem;
  border-top: 1px solid var(--border-subtle);
  background: rgba(26, 11, 33, 0.5);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.25rem;
}

.form-group-full {
  grid-column: span 2;
}

.form-label {
  display: block;
  font-size: 0.83rem;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 0.4rem;
}

.form-label .required {
  color: var(--diali-pink-light);
}

.form-control {
  width: 100%;
  padding: 0.75rem 1rem;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  color: var(--text-main);
  font-size: 0.89rem;
  font-family: var(--font-body);
  transition: var(--transition);
}

.form-control:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--primary-glow);
}

textarea.form-control {
  resize: vertical;
  min-height: 90px;
}

.phase-accordion {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  margin-top: 1rem;
}

.phase-card {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: rgba(19, 7, 24, 0.55);
}

.phase-header {
  padding: 1rem 1.25rem;
  background: rgba(255, 255, 255, 0.03);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
  border-left: 4px solid var(--diali-pink);
}

.phase-header.phase-green { border-left-color: #78D64B; }
.phase-header.phase-orange { border-left-color: #FFB549; }

.phase-title {
  font-family: var(--font-heading);
  font-size: 0.98rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  color: #ffffff;
}

.phase-content {
  padding: 1.25rem;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}

.detail-item {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.detail-item-full {
  grid-column: span 2;
}

.detail-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-dim);
  font-weight: 700;
}

.detail-value {
  font-size: 0.92rem;
  color: var(--text-main);
  font-weight: 500;
}

.plate-editable-box {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.badge-plate {
  font-family: monospace;
  font-weight: 800;
  font-size: 0.92rem;
  background: linear-gradient(135deg, var(--diali-pink), var(--diali-purple));
  color: #ffffff;
  padding: 0.25rem 0.65rem;
  border-radius: var(--radius-sm);
  letter-spacing: 0.05em;
}

.file-preview-card {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 0.5rem;
  padding: 0.5rem 0.75rem;
  background: rgba(36, 15, 46, 0.7);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  animation: fadeIn 0.2s ease;
}

.file-preview-card img {
  width: 52px;
  height: 52px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid rgba(206, 0, 88, 0.3);
}

.file-preview-details {
  display: flex;
  flex: 1;
  justify-content: space-between;
  align-items: center;
  min-width: 0;
}

.file-preview-name {
  font-size: 0.8rem;
  color: #f1f5f9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 170px;
}

.btn-remove-preview {
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #f87171;
  padding: 0.25rem 0.55rem;
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 4px;
  cursor: pointer;
  transition: var(--transition);
}

.btn-remove-preview:hover {
  background: #ef4444;
  color: #fff;
}

.badge-evidence {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  padding: 0.2rem 0.55rem;
  background: rgba(44, 213, 196, 0.14);
  border: 1px solid rgba(44, 213, 196, 0.4);
  color: #2CD5C4;
  border-radius: 4px;
  font-size: 0.73rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 0.3rem;
  transition: var(--transition);
}

.badge-evidence:hover {
  background: rgba(44, 213, 196, 0.28);
  transform: translateY(-1px);
}

.badge-evidence-cierre {
  background: rgba(120, 214, 75, 0.16);
  border-color: rgba(120, 214, 75, 0.4);
  color: #78D64B;
}

.badge-evidence-cierre:hover {
  background: rgba(120, 214, 75, 0.3);
}

.evidence-card {
  display: inline-block;
  background: rgba(21, 9, 27, 0.75);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
  max-width: 320px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.evidence-card:hover {
  border-color: var(--diali-pink);
  box-shadow: var(--shadow-glow);
}

.evidence-thumb-wrapper {
  position: relative;
  width: 100%;
  height: 180px;
  background: #0f0512;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.evidence-thumb-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.evidence-thumb-wrapper:hover img {
  transform: scale(1.05);
}

.evidence-overlay-zoom {
  position: absolute;
  inset: 0;
  background: rgba(15, 5, 18, 0.65);
  opacity: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  color: #ffffff;
  font-weight: 700;
  font-size: 0.85rem;
  transition: opacity 0.2s ease;
